<script>
// --- LÓGICA DE LA PÁGINA DE DETALLE (producto.html) ---
const newsletterForm = document.getElementById('newsletter-form');
if (newsletterForm) {
    newsletterForm.addEventListener('submit', (e) => {
        e.preventDefault(); 
        alert('¡Gracias por suscribirte!');
        newsletterForm.reset();
    });
}

document.addEventListener('DOMContentLoaded', () => {
    const detailContainer = document.getElementById('productDetailContainer');
    if (!detailContainer) return;

    // 1. Obtenemos el nombre de la URL
    const params = new URLSearchParams(window.location.search);
    const productName = params.get('name');

    // 2. Hacemos el Fetch al WEBHOOK DE n8n (Igual que en script.js)
    fetch('http://localhost:5678/webhook/productos')
        .then(respuesta => {
            if (!respuesta.ok) throw new Error("Error en la API de n8n");
            return respuesta.json();
        })
        .then(data => {
            // 3. Extraemos los productos adaptándonos al formato de n8n
            let productos = [];
            if (data.lista && Array.isArray(data.lista)) {
                productos = data.lista;
            } else if (Array.isArray(data)) {
                productos = data.map(item => item.json || item);
            } else if (data.json && data.json.lista) {
                productos = data.json.lista;
            } else {
                productos = [data];
            }

            // 4. Buscamos el producto por NOMBRE exacto
            let productoEncontrado = null;
            if (productName) {
                const nombreBuscado = decodeURIComponent(productName).toLowerCase();
                productoEncontrado = productos.find(p => String(p.nombre).toLowerCase() === nombreBuscado);
            }

            // 5. Si se encuentra, creamos la tarjeta
            if (productoEncontrado) {
                detailContainer.innerHTML = ''; 
                const tarjetaDetalle = crearTarjetaProducto(productoEncontrado);
                detailContainer.appendChild(tarjetaDetalle);
            } else {
                detailContainer.innerHTML = `
                    <div class="error-product" style="text-align: center; padding: 3rem;">
                        <h2>Producto no encontrado</h2>
                        <p>Lo sentimos, no pudimos encontrar el producto que buscas.</p>
                        <a href="tienda.html" class="pCbutton" style="display:inline-block; margin-top:15px;">Volver a la tienda</a>
                    </div>
                `;
            }
        })
        .catch(error => {
            console.error("Error cargando el producto:", error);
            detailContainer.innerHTML = `
                <div style="text-align: center; padding: 3rem;">
                    <h2>Error de conexión</h2>
                    <p>No se pudo conectar con n8n. Asegúrate de que el webhook esté activo.</p>
                </div>
            `;
        });
});
